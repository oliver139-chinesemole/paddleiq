services:
  - type: web
    name: paddleiq
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci && npm run build
    # `next start`, not the standalone server: next.config sets no
    # `output: "standalone"`, so .next/standalone is never produced and this
    # file would have failed on a path that doesn't exist. The live service
    # runs from the Render dashboard settings, which is why nobody noticed.
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=400"
      - key: NPM_CONFIG_FUND
        value: "false"
      - key: NPM_CONFIG_AUDIT
        value: "false"
      - key: NEXT_PUBLIC_APP_URL
        value: https://paddleiq.onrender.com
      - key: NEXT_PUBLIC_APP_NAME
        value: PaddleIQ
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
